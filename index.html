    <!-- Static SEO tags: social scrapers don't run JS, so these must live in the HTML -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Michael Eddleston",
        "jobTitle": "Software Engineer",
        "description": "Software Engineer specialising in React, TypeScript, and Python. Previously at ARM.",
        "url": "https://michaeleddleston.com/",
        "image": "https://michaeleddleston.com/og-image.jpg",
        "sameAs": [
          "https://www.linkedin.com/in/michael-eddleston-4867a1214/",
          "https://github.com/Micmada"
        ],
        "alumniOf": {
          "@type": "CollegeOrUniversity",

        },
        "worksFor": {
          "@type": "Organization",
          "name": "page-flow",
          "url": "https://page-flow.co.uk/"
        },

          "Software Engineering",
          "Web Development",
          "React",
          "TypeScript",

          "Python",
          "Node.js",
          "Full Stack Development"
        ],
        "address": {

        }
      }

    <!-- Apply theme before first paint to avoid a light flash for dark-mode users -->
    <script>
      (function () {
        var theme;
        try { theme = localStorage.getItem('theme'); } catch (e) {}
        // The design is dark-first; light is an opt-in via the toggle.
        if (theme !== 'light' && theme !== 'dark') theme = 'dark';
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
